# Static Astro site — custom worker for preview-host noindex; assets served from dist/.
# GitHub (Cloudflare Workers Builds): https://github.com/haniarooziroti/Filters-bf6che-t.org
# Production branch: main
name = "bf6cheat-org"
main = "worker.mjs"
compatibility_date = "2025-10-11"

[build]
command = "npm ci && npm run build"
cwd = "."

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"

# Attach production hostnames to this worker (requires zone on same Cloudflare account).
[[routes]]
pattern = "bf6cheat.org"
custom_domain = true

[[routes]]
pattern = "www.bf6cheat.org"
custom_domain = true
