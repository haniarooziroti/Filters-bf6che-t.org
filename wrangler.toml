# Static Astro site — custom worker for preview-host noindex; assets served from dist/.
# GitHub (Cloudflare Workers Builds): https://github.com/haniarooziroti/Filters-bf6che-t.org
# Production branch: main
name = "bf6cheat-org"
main = "worker.mjs"
compatibility_date = "2025-10-11"

[build]
command = "npm ci && npm run build"
cwd = "."

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"

# Custom domains for bf6cheat.org must be added in the dashboard (zone must be on this account).
# Workers & Pages → bf6cheat-org → Settings → Domains & Routes → Add custom domain.
workers_dev = true
